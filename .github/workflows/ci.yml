name: NexusDev CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


  jobs:
    backend:
      name: Backend (NestJS)
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: nexusdev
            POSTGRES_PASSWORD: nexusdev_test
            POSTGRES_DB: textbook_marketplace_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - uses: actions/checkout@v4
        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install deps
          run: npm ci

        - name: Lint & Test
          working-directory: backend
          run: |
            npm run lint
            npm run test:cov
          env:
            DATABASE_URL: postgresql://nexusdev:nexusdev_test@localhost:5432/textbook_marketplace_test
            JWT_ACCESS_SECRET: ci_test_secret
            NODE_ENV: test

          - name: Upload Report
            uses: codecov/codecov-action@v4
            with:
              directory: backend/coverage
              flags: backend
              token: ${{ secrets.CODECOV_TOKEN }}
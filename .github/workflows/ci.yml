name: NexusDev CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


  jobs:
    backend:
      name: Backend (NestJS)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'
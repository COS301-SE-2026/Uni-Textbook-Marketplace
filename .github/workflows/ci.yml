name: NexusDev CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  backend:
      name: Backend (NestJS)
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: nexusdev
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
            POSTGRES_DB: textbook_marketplace_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - uses: actions/checkout@v4
        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install deps
          run: npm ci --ignore-scripts

        - name: Lint & Test
          working-directory: backend
          run: |
            npm run lint
            npm run test:cov
          env:
            DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_test
            JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
            NODE_ENV: test

        - name: E2E Tests (Supertest)
          working-directory: backend
          run: npm run test:e2e
          env:
            DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_test
            JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
            NODE_ENV: test
            AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
            AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
            AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
            MAIL_HOST: ${{ secrets.MAIL_HOST }}
            MAIL_PORT: 587
            MAILTRAP_USER: ${{ secrets.MAILTRAP_USER }}
            MAILTRAP_PASS: ${{ secrets.MAILTRAP_PASS }}
            MAIL_FROM: ${{ secrets.MAIL_FROM }}
            FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

        - name: Upload Report
          uses: codecov/codecov-action@v4
          with:
            directory: backend/coverage
            flags: backend
            token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
      name: Frontend (Next.js)
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install deps
          run: npm ci --ignore-scripts

        - name: Verification & Build
          working-directory: frontend
          run: |
            npm run lint
            npm run test:coverage
            npm run build
          env:
            NEXT_PUBLIC_API_URL: http://localhost:3001

        - name: Upload Report
          uses: codecov/codecov-action@v4
          with:
            directory: frontend/coverage
            flags: frontend
            token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
      name: E2E (Cypress)
      runs-on: ubuntu-latest
      needs: [backend, frontend]

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: nexusdev
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
            POSTGRES_DB: textbook_marketplace_e2e
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      env:
        DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_e2e
        JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        NODE_ENV: test

        MAIL_HOST: ${{ secrets.MAIL_HOST }}
        MAIL_PORT: 587
        MAILTRAP_USER: ${{ secrets.MAILTRAP_USER }}
        MAILTRAP_PASS: ${{ secrets.MAILTRAP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}

        AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
        AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}

        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      steps:
        - uses: actions/checkout@v4

        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Cache Cypress binary
          uses: actions/cache@v4
          with:
            path: ~/.cache/Cypress
            key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

        - name: Install deps
          run: npm ci --ignore-scripts

        - name: Install Cypress binary
          working-directory: frontend
          run: npm run cypress:install

        - name: Run migrations
          working-directory: backend
          run: npm run migration:run
        
        - name: Run seeds
          working-directory: backend
          run: npm run seed

        - name: Start backend
          working-directory: backend
          run: npm run start:dev > backend.log 2>&1 &

        - name: Wait for backend to be ready
          run: node_modules/.bin/wait-on http://localhost:3001/api --timeout 60000

        - name: Show backend log if it failed to start
          if: failure()
          run: cat backend/backend.log

        - name: Build frontend
          working-directory: frontend
          run: npm run build
          env:
            NEXT_PUBLIC_API_URL: http://localhost:3001/api

        - name: Start frontend
          working-directory: frontend
          run: npm run start &

        - name: Wait for frontend to be ready
          run: node_modules/.bin/wait-on http://localhost:3000 --timeout 60000

        - name: Run Cypress
          working-directory: frontend
          run: npm run cy:run
          
        - name: Upload Cypress screenshots on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: cypress-screenshots
            path: frontend/cypress/screenshots

  ci-success:
      name: Gatekeeper
      runs-on: ubuntu-latest
      needs: [backend, frontend]
      steps:
        - run: exit 0
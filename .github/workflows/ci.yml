name: NexusDev CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  backend:
      name: Backend (NestJS)
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: nexusdev
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
            POSTGRES_DB: textbook_marketplace_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - uses: actions/checkout@v4
        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install deps
          run: npm ci --ignore-scripts

        - name: Lint & Test
          working-directory: backend
          run: |
            npm run lint
            npm run test:cov
          env:
            DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_test
            JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
            NODE_ENV: test

        - name: E2E Tests (Supertest)
          working-directory: backend
          run: npm run test:e2e
          env:
            DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_test
            JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
            NODE_ENV: test

        - name: Upload Report
          uses: codecov/codecov-action@v4
          with:
            directory: backend/coverage
            flags: backend
            token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
      name: Frontend (Next.js)
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Init Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install deps
          run: npm ci --ignore-scripts

        - name: Verification & Build
          working-directory: frontend
          run: |
            npm run lint
            npm run test:coverage
            npm run build
          env:
            NEXT_PUBLIC_API_URL: http://localhost:3001

        - name: Upload Report
          uses: codecov/codecov-action@v4
          with:
            directory: frontend/coverage
            flags: frontend
            token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
      name: E2E (Cypress)
      runs-on: ubuntu-latest
      needs: [backend, frontend]

      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: nexusdev
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
            POSTGRES_DB: textbook_marketplace_e2e
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      env:
        DATABASE_URL: postgresql://nexusdev:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/textbook_marketplace_e2e
        JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        NODE_ENV: test

        MAIL_HOST: sandbox.smtp.mailtrap.io
        MAIL_PORT: 587
        MAIL_USER: ${{ secrets.MAILTRAP_USER }}
        MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}

  ci-success:
      name: Gatekeeper
      runs-on: ubuntu-latest
      needs: [backend, frontend]
      steps:
        - run: exit 0
name: Deploy to Azure Container Apps

on:
    push:
        branches: [main]

jobs:
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to Azure
              uses: azure/login@v2
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Build & Push Backend Image
              run: |
                az acr build \
                --registry nexusdevtukscos301 \
                --image nexusdev-backend:${{ github.sha }} \
                ./backend

            - name: Update Container App
              run: |
                az containerapp update \
                 --name nexusdev-backend \
                 --resource-group NexusDev \
                 --image  nexusdevtukscos301.azurecr.io/nexusdev-backend:${{ github.sha }}

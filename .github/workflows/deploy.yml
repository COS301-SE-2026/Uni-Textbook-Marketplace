name: Deploy to Azure Container Apps

on:
    push:
        branches: [main, develop]

jobs:
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

            - name: Log in to Azure
              uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 #v2.3.0
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set deploy target
              run: |
               if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                 echo "BACKEND_APP=nexusdev-backend" >> $GITHUB_ENV
               else
                 echo "BACKEND_APP=nexusdev-backend-staging" >> $GITHUB_ENV
               fi

            - name: Build & Push Backend Image
              run: |
                az acr build \
                --registry nexusdevtukscos301 \
                --image nexusdev-backend:${{ github.sha }} \
                ./backend

            - name: Update Container App
              run: |
                az containerapp update \
                --name ${{ env.BACKEND_APP }} \
                --resource-group NexusDev \
                --image nexusdevtukscos301.azurecr.io/nexusdev-backend:${{ github.sha }}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="How it works: register, list, discover, meet up">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1F3D"/>
      <stop offset="1" stop-color="#143B6B"/>
    </linearGradient>
    <style>
      .n{font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-weight:800;font-size:22px;fill:#fff}
      .h{font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-weight:700;font-size:18px;fill:#fff}
      .s{font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-size:13px;fill:#B8D4EA}
      .dash{stroke-dasharray:10 8;animation:f 1.2s linear infinite}
      @keyframes f{to{stroke-dashoffset:-18}}
      .ring{animation:r 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes r{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="250" rx="22" fill="url(#bg)"/>

  <line class="dash" x1="190" y1="90" x2="410" y2="90" stroke="#00B4D8" stroke-width="3"/>
  <line class="dash" x1="490" y1="90" x2="710" y2="90" stroke="#00B4D8" stroke-width="3"/>
  <line class="dash" x1="790" y1="90" x2="1010" y2="90" stroke="#00B4D8" stroke-width="3"/>

  <g transform="translate(150 90)">
    <circle class="ring" r="38" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <circle r="38" fill="#00B4D8"/><text class="n" text-anchor="middle" y="8">1</text>
    <text class="h" text-anchor="middle" y="76">Register</text>
    <text class="s" text-anchor="middle" y="100">University email + OTP</text>
    <text class="s" text-anchor="middle" y="120">verifies you are a student</text>
  </g>
  <g transform="translate(450 90)">
    <circle class="ring" r="38" fill="none" stroke="#00E5FF" stroke-width="2" style="animation-delay:.7s"/>
    <circle r="38" fill="#00B4D8"/><text class="n" text-anchor="middle" y="8">2</text>
    <text class="h" text-anchor="middle" y="76">List</text>
    <text class="s" text-anchor="middle" y="100">Structured listing, reviewed</text>
    <text class="s" text-anchor="middle" y="120">by an admin before going live</text>
  </g>
  <g transform="translate(750 90)">
    <circle class="ring" r="38" fill="none" stroke="#00E5FF" stroke-width="2" style="animation-delay:1.4s"/>
    <circle r="38" fill="#00B4D8"/><text class="n" text-anchor="middle" y="8">3</text>
    <text class="h" text-anchor="middle" y="76">Discover</text>
    <text class="s" text-anchor="middle" y="100">Filters, saved searches, alerts,</text>
    <text class="s" text-anchor="middle" y="120">auctions and bundle deals</text>
  </g>
  <g transform="translate(1050 90)">
    <circle class="ring" r="38" fill="none" stroke="#00E5FF" stroke-width="2" style="animation-delay:2.1s"/>
    <circle r="38" fill="#00B4D8"/><text class="n" text-anchor="middle" y="8">4</text>
    <text class="h" text-anchor="middle" y="76">Meet Up</text>
    <text class="s" text-anchor="middle" y="100">Chat privately, arrange a meetup.</text>
    <text class="s" text-anchor="middle" y="120">No payment processing.</text>
  </g>
</svg>

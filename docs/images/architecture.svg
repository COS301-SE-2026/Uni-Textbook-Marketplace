<g class="ex"><title>Firebase Firestore for chat and live bids</title><rect x="205" y="895" width="150" height="65" rx="6"/><text x="280.0" y="924.5">Messaging /</text><text x="280.0" y="940.5">Real-time Service</text></g>
<g class="ex"><title>Azure AI Vision</title><rect x="370" y="895" width="150" height="65" rx="6"/><text x="445.0" y="924.5">Vision / OCR</text><text x="445.0" y="940.5">Service</text></g>

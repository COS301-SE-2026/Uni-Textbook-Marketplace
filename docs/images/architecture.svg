<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-label="Layered architecture: browser, web UI, controllers, bounded domain modules, repository and database, external services">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1F3D"/><stop offset="1" stop-color="#112F57"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#CFE9F7"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00B4D8"/></marker>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text{font-family:Montserrat,'Segoe UI',Arial,sans-serif}
.lay{fill:#FFFFFF;fill-opacity:.03;stroke:#7FDFF5;stroke-opacity:.25;stroke-width:1.5}
.ll{font-size:14px;font-weight:700;fill:#7FDFF5}
.bx rect,.bx path,.bx ellipse{fill:#0F2D52;stroke:#00B4D8;stroke-width:1.8;transition:fill .2s}
.bx text{font-size:13.5px;fill:#fff;text-anchor:middle;pointer-events:none}
.bx:hover rect,.bx:hover path,.bx:hover ellipse{fill:#1C5A8E}
.ex rect,.ex path,.ex ellipse{fill:#143B6B;stroke:#7C5CFF;stroke-width:2;transition:fill .2s}
.ex:hover rect,.ex:hover path,.ex:hover ellipse{fill:#2A4F96}
.ex text{font-size:13.5px;fill:#fff;text-anchor:middle;pointer-events:none}
.ln{stroke:#CFE9F7;stroke-opacity:.85;stroke-width:2;fill:none}
.bl{stroke:#00B4D8;stroke-width:2.5;fill:none;stroke-dasharray:9 7;animation:fl 1s linear infinite}
.rt{stroke:#00E5FF;stroke-width:2.5;fill:none;stroke-dasharray:9 7;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-16}}
.pl{fill:#0A1F3D;fill-opacity:.92}
.pt{font-size:11.5px;fill:#CFE9F7;text-anchor:middle}
</style>
</defs>
<rect width="1200" height="1040" rx="22" fill="url(#bg)"/>
<rect class="lay" x="8" y="70" width="1172" height="100" rx="12"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.08;.2;1" dur="10s" begin="0s" repeatCount="indefinite"/></rect>
<text class="ll" x="24" y="94">GUI / Presentation Layer</text>
<rect class="lay" x="8" y="190" width="1172" height="100" rx="12"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.08;.2;1" dur="10s" begin="2s" repeatCount="indefinite"/></rect>
<text class="ll" x="24" y="214">Controller / API Layer</text>
<rect class="lay" x="8" y="310" width="1172" height="265" rx="12"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.08;.2;1" dur="10s" begin="4s" repeatCount="indefinite"/></rect>
<text class="ll" x="24" y="334">Business Objects Layer (domain modules + audit log, bounded, no cross-injection)</text>
<rect class="lay" x="8" y="595" width="1172" height="175" rx="12"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.08;.2;1" dur="10s" begin="6s" repeatCount="indefinite"/></rect>
<text class="ll" x="24" y="619">Data Persistence Layer</text>
<rect class="lay" x="8" y="790" width="1172" height="220" rx="12"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.08;.2;1" dur="10s" begin="8s" repeatCount="indefinite"/></rect>
<text class="ll" x="1166" y="814" text-anchor="end">External Layer</text>
<g class="bx"><title>Students and admins use the web app in a browser</title><rect x="520" y="10" width="160" height="40" rx="6"/><text x="600.0" y="35.0">Client Browser</text></g>
<path class="ln" d="M600 50V105" marker-start="url(#ar)" marker-end="url(#ar)"/>
<g class="bx"><title>Next.js + React + Tailwind frontend</title><rect x="490" y="105" width="220" height="50" rx="6"/><text x="600.0" y="135.0">Web UI Components</text></g>

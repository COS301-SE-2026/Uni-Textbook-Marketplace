<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#1F497D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)"/>
  <rect x="540" y="8" width="120" height="8" rx="4" fill="#0A1F3D"/>
  <rect x="540" y="8" width="120" height="8" rx="4" fill="none" stroke="#00B4D8" stroke-width="1.5"/>
  <circle cx="570" cy="12" r="3" fill="#00B4D8"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="12" r="3" fill="#00E5FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="630" cy="12" r="3" fill="#00B4D8"><animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="0" cy="12" r="10" fill="url(#glow)">
    <animate attributeName="cx" values="0;1200" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1200" cy="12" r="8" fill="url(#glow)" opacity="0.7">
    <animate attributeName="cx" values="1200;0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>

  /books:
    post:
      operationId: createBook
      tags: [Books]
      summary: Creates a book record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                isbn:
                  type: string
                edition:
                  type: integer
      responses:
        "201":
          description: Book created
        "400":
          $ref: "#/components/responses/BadRequest"

  /bundles/optimize:
    post:
      operationId: optimizeBundle
      tags: [Bundles]
      summary: Optimizes a bundle for the supplied module IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleIds]
              properties:
                moduleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Optimized bundle result
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auction:
    get:
      operationId: getAuctions
      tags: [Auctions]
      summary: Returns available auctions.
      responses:
        "200":
          description: Auctions
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createAuction
      tags: [Auctions]
      summary: Creates an auction for an approved listing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, starting_price, end_time]
              properties:
                listing_id:
                  type: string
                  format: uuid
                starting_price:
                  type: number
                  minimum: 0
                reserve_price:
                  type: number
                  minimum: 0
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Auction created
        "400":
          $ref: "#/components/responses/BadRequest"

  /auction/listing/{listingId}:
    get:
      operationId: getAuctionForListing
      tags: [Auctions]
      summary: Gets the active or scheduled auction for a listing.
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Auction for the listing
        "404":
          $ref: "#/components/responses/NotFound"

  /auction/{id}:
    get:
      operationId: getAuctionById
      tags: [Auctions]
      summary: Returns the current state of one auction.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Auction details
        "404":
          $ref: "#/components/responses/NotFound"

  /auction/{id}/bids:
    get:
      operationId: getAuctionBidHistory
      tags: [Auctions]
      summary: Returns paginated bid history for an auction.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated bid history
        "400":
          $ref: "#/components/responses/BadRequest"

  /auction/{id}/bid:
    post:
      operationId: placeAuctionBid
      tags: [Auctions]
      summary: Places a bid on an auction.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
      responses:
        "201":
          description: Bid placed
        "400":
          $ref: "#/components/responses/BadRequest"

  /images/test:
    get:
      operationId: testImageService
      tags: [Images]
      summary: Checks whether the image controller is online.
      responses:
        "200":
          description: Image service status
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/audit-log:
    get:
      operationId: getAuditLog
      tags: [Admin]
      summary: Returns audit log entries for admin review.
      parameters:
        - in: query
          name: performedBy
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string }
        - in: query
          name: endDate
          schema: { type: string }
      responses:
        "200":
          description: Audit log entries
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/emails:
    get:
      operationId: getAdminEmails
      tags: [Admin]
      summary: Returns a list of admin emails, used for filters.
      responses:
        "200":
          description: Admin emails
        "403":
          $ref: "#/components/responses/Forbidden"

  /images/upload:
    post:
      operationId: uploadListingImages
      tags: [Images]
      summary: Uploads a listing image to Azure Blob Storage through the backend.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Image uploaded
        "400":
          $ref: "#/components/responses/BadRequest"

  /images/list:
    get:
      operationId: listImages
      tags: [Images]
      summary: Lists uploaded images for a listing.
      responses:
        "200":
          description: Image list
        "401":
          $ref: "#/components/responses/Unauthorized"

  /images/delete:
    delete:
      operationId: deleteImage
      tags: [Images]
      summary: Deletes an uploaded listing image from Blob Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"

  /vision/extract-text:
    post:
      operationId: extractTextFromImage
      tags: [Vision]
      summary: >
        Runs Azure AI Vision OCR (Image Analysis 4.0 Read API) on a listing
        photo already uploaded to Blob Storage via the existing /images/upload
        flow, then fuzzy-matches the extracted text against the Book table.
        Pre-fills CreateListingDto fields for the seller to review and edit,
        never auto-submits a listing. Backend-mediated: the Azure Vision
        endpoint and key are never exposed to the client. Background removal
        and corner-crop detection are not part of this endpoint - they run
        entirely client-side (frontend/src/utils/removeUniformBackground.ts).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl:
                  type: string
                  description: URL of the photo already uploaded via the existing /images/upload flow.
      responses:
        "200":
          description: >
            OCR text extracted. matchedBook is null if no confident match
            was found - the frontend falls back to manual entry with the
            photo kept and every field still editable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
        "400":
          description: Missing or invalid imageUrl
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /conversations:
    post:
      operationId: createConversation
      tags: [Conversations]
      summary: Creates or fetches a conversation for a listing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listingId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Conversation created or fetched
        "401":
          $ref: "#/components/responses/Unauthorized"

  /conversations/mine:
    get:
      operationId: getMyConversations
      tags: [Conversations]
      summary: Gets all conversations for the logged-in user.
      responses:
        "200":
          description: The user's conversations
        "401":
          $ref: "#/components/responses/Unauthorized"

  /conversations/{id}/messages:
    get:
      operationId: getConversationMessages
      tags: [Conversations]
      summary: Gets all messages in a conversation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages in the conversation
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: sendConversationMessage
      tags: [Conversations]
      summary: Sends a message in a conversation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "201":
          description: Message sent
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports:
    post:
      operationId: createReport
      tags: [Reports]
      summary: A student submits a report against a listing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, reason]
              properties:
                listingId:
                  type: string
                  format: uuid
                  description: The ID of the listing being reported
                reason:
                  type: string
                  description: The reason for the report
      responses:
        "201":
          description: Report submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/reports:
    get:
      operationId: getReportsForAdmin
      tags: [Reports]
      summary: Returns reports for admin review, paginated, filterable by status. 
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, REVIEWED] }
        - in: query
          name: page
          schema: { type: integer }
          description: Page number
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of reports returned per page.
      responses:
        "200":
          description: List of reports for admin review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reports/{id}:
    get:
      operationId: getReportById
      tags: [Reports]
      summary: Returns one report for admin review.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/reports/{id}/dismiss:
    patch:
      operationId: dismissReport
      tags: [Reports]
      summary: Dismisses a report without banning the reported user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: The ID of the report to dismiss
      responses:
        "200":
          description: Report dismissed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/{id}/ban:
    patch:
      operationId: banUser
      tags: [Reports]
      summary: >
        Bans the user who owns the reported listing. Writes an audit_log
        entry (action = BANNED) and triggers a ban-notice notification with
        appeal instructions via NotificationService.emit().
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for banning the user
      responses:
        "200":
          description: User banned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases:
    post:
      operationId: createAppeal
      tags: [Cases]
      summary: Submit an appeal as a banned user
      description: Only users with is_banned = true can submit appeals. Users cannot have multiple pending appeals.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appeal_message]
              properties:
                appeal_message:
                  type: string
                  minLength: 10
                  maxLength: 5000
                  description: The appeal message from the banned user
      responses:
        "201":
          description: Appeal submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: User is not banned or already has a pending appeal
        "401":
          description: Unauthorized - user not logged in
        "403":
          description: Forbidden - only banned users may submit an appeal

  /cases/mine:
    get:
      operationId: getMyCases
      tags: [Cases]
      summary: Get all cases for the authenticated user
      description: Returns all cases submitted by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized - user not logged in

  /cases/{id}:
    get:
      operationId: getCaseById
      tags: [Cases]
      summary: Get a specific case by ID
      description: Users can only access their own cases
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the case to retrieve
      responses:
        "200":
          description: Case found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized - user not logged in
        "404":
          description: Case not found

  /cases/admin/pending:
    get:
      operationId: getPendingCases
      tags: [Cases]
      summary: ADMIN ONLY - Get all pending cases
      description: Returns all cases with status = pending for admin review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of pending cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseResponse"
        "401":
          description: Unauthorized - user not logged in
        "403":
          description: Forbidden - admin access required

  /cases/admin:
    get:
      operationId: getAllCases
      tags: [Cases]
      summary: ADMIN ONLY - Get all cases with pagination
      description: Returns all cases with pagination for admin dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: "Page number (default : 1)"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Items per page (default: 20, max: 100)"
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, upheld, reversed]
          description: Filter by status (pending, upheld, reversed)
        - in: query
          name: search
          schema:
            type: string
          description: Search in appeal message
      responses:
        "200":
          description: Paginated list of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCasesResponse"
        "401":
          description: Unauthorized - user not logged in
        "403":
          description: Forbidden - admin access required

  /cases/{id}/review:
    patch:
      operationId: reviewCase
      tags: [Cases]
      summary: ADMIN ONLY - Review a case (decide endpoint)
      description: >
        Admin upholds the ban or reinstates the account (reverses the ban).
        Writes to audit_log and triggers a case-decision notification via emit().
        - "upheld": User remains banned (ban is maintained)
        - "reversed": User is reinstated (ban is lifted)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the case to review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [upheld, reversed]
                  description: |
                    - "upheld": Maintain the ban (user stays banned)
                    - "reversed": Reinstate the user (lift the ban)
                adminNotes:
                  type: string
                  maxLength: 1000
                  description: Optional notes from the admin about the decision
      responses:
        "200":
          description: Case reviewed successfully (decision applied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: Case already reviewed or invalid decision
        "401":
          description: Unauthorized - user not logged in
        "403":
          description: Forbidden - admin access required
        "404":
          description: Case not found

security:
  - bearerAuth: []
openapi: 3.0.4
info:
  title: Uni Textbook Marketplace API
  description: >
    NexusDev - Uni Textbook Marketplace, COS 301 Software Engineering, 2026.
    Single source of truth for the API contract. Everyone edits this file
    directly, the same day and endpoint is committed. sas.tex's API Contracts
    section is a readbale rendering of this file, not an independently
    maintained copy. If the two disagree, this file is right.
  version: "5.0.0"
  contact:
    name: NexusDev
    url: https://github.com/COS301-SE-2026

servers:
  - url: https://nexusdev-backend.whitesand-df72b78b.southafricanorth.azurecontainerapps.io/api
    description: Production (main)
  - url: https://nexusdev-backend-staging.whitesand-df72b78b.southafricanorth.azurecontainerapps.io/api
    description: Staging (develop)
  - url: http://localhost:3001/api
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Listings
  - name: Admin
  - name: Auctions
  - name: Books
  - name: Bundles
  - name: Modules
  - name: SavedSearches
  - name: Wishlist
  - name: Images
  - name: Conversations
  - name: Notifications
    description: "Sprint 5 / UC9, UC9.1, UC9.2. Owner: Gift."
  - name: Reports
    description: "Sprint 5 / UC10. Owner: Josh."
  - name: Cases
    description: "Sprint 5 / UC10 appeal flow. Owner: Neo."
  - name: Profile
    description: "Test week / Profile-Settings. Owner: Tiego + whoever has capacity."
  - name: Vision
    description: "Sprint 6 / Wow Factor 1, AI-Assisted Listing Creation. Owner: Tiego."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        edition:
          type: integer
        condition:
          type: string
          enum: [new, good, fair, poor]
        annotationLevel:
          type: string
          enum: [none, light, heavy]
        hasNotes:
          type: boolean
        price:
          type: number
          format: float
        status:
          type: string
          enum:
            [
              PENDING,
              APPROVED,
              REJECTED,
              RESERVED,
              SOLD,
              WITHDRAWN,
              SOFT_DELETED,
            ]
        moduleId:
          type: string
          format: uuid
        photoUrls:
          type: array
          items:
            type: string
        sellerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          description: >
            Drives frontend icon, copy, and routing (see Tiego's
            type-to-route map alongside utils/messageHelpers.ts).
            Keep this enum in sync with every new type introduced -
            flag additions the same day.
          enum:
            - LISTING_APPROVED
            - LISTING_REJECTED
            - LISTING_EDIT_NEEDS_REVIEW
            - WISHLIST_STATUS_CHANGE
            - NEW_MESSAGE
            - SAVED_SEARCH_MATCH
            - REPORT_RECEIVED
            - BAN_ISSUED
            - CASE_DECISION
        payload:
          type: object
          description: Free-form JSON, shape depends on `type`.
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
          description: The ID of the user who submitted the report
        listingId:
          type: string
          format: uuid
          description: The ID of the listing being reported
        reason:
          type: string
          description: The reason for the report
        status:
          type: string
          enum: [PENDING, REVIEWED]
          description: The current status of the report
        createdAt:
          type: string
          format: date-time
          description: Timestamp of report creation

    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        
        appeal_message:
          type: string
        status:
          type: string
          enum: [PENDING, UPHELD, REVERSED]
        reviewed_by:
          type: string
          format: uuid
        reviewed_at:
          type: string
          format: date-time
        created_at: #added column for case date ordering + keeping track of stale cases
          type: string
          format: date-time
        updated_at: #added column for keeping track of updates in cases
          type: string
          format: date-time
        deleted_at: #added column for keeping track of case removals
          type: string
          format: date-time

    CaseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the case
        user_id:
          type: string
          format: uuid
          description: The ID of the user who submitted the appeal
        appeal_message:
          type: string
          nullable: true
          description: The appeal message from the user
        status:
          type: string
          enum: [pending, upheld, reversed]
          description: |
            The current status of the case:
            - "pending": Awaiting admin review
            - "upheld": Ban maintained (user remains banned)
            - "reversed": Ban lifted (user reinstated)
        reviewed_by:
          type: string
          format: uuid
          nullable: true
          description: The ID of the admin who reviewed the case
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          description: When the case was reviewed
        created_at:
          type: string
          format: date-time
          description: When the case was created
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the case was last updated
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: When the case was soft-deleted

    PaginatedCasesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CaseResponse"
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of cases
            page:
              type: integer
              description: Current page number
            limit:
              type: integer
              description: Items per page
            totalPages:
              type: integer
              description: Total number of pages

    MatchedBook:
      type: object
      description: >
        The Book record the OCR text was fuzzy-matched against. Absent
        (matchedBook is null on the parent response) when no confident
        match was found.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        edition:
          type: integer
        confidence:
          type: number
          format: float
          description: Fuzzy-match confidence score (0 to 1) between the OCR text and this Book record.

    ExtractTextResponse:
      type: object
      properties:
        rawText:
          type: string
          description: Raw text lines returned by Azure AI Vision's Read API (Image Analysis 4.0), before fuzzy matching.
        matchedBook:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MatchedBook"
          description: Best fuzzy match against the Book table, or null if nothing matched with enough confidence.

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted (wrong role, not the owner)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is invalid or could not be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Returns the API welcome message.
      security: []
      responses:
        "200":
          description: API is responding
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /notifications/stream:
    get:
      operationId: streamNotifications
      tags: [Notifications]
      summary: Streams live notifications for the authenticated user.
      responses:
        "200":
          description: Server-sent notification events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/mine:
    get:
      operationId: getMyNotifications
      tags: [Notifications]
      summary: Returns the logged-in user's notifications, paginated.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      pages: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No notification found

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Marks a single notification as read.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Number of rows updated, but 0 if not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Marks all of the logged-in user's notifications as read.
      responses:
        "200":
          description: Number of rows updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/delete:
    delete:
      operationId: deleteNotification
      tags: [Notifications]
      summary: Deletes a notification belonging to the logged-in user.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                type: string
                example: "Notification successfully deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      operationId: registerStudent
      tags: [Auth]
      summary: Starts student registration. Checks the email domain and sends the OTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, surname, university, email]
              properties:
                fullName:
                  type: string
                surname:
                  type: string
                university:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: Registration successful, OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: string
                    format: uuid
        "400":
          description: Missing required field, or email domain not in allowlist
        "409":
          description: Email address is already registered

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Verifies the 6-digit code sent to the student's email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  verified:
                    type: boolean
        "400":
          description: OTP is incorrect or has expired
        "404":
          description: No pending OTP found for this email

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Logs in a verified student and hands back a signed JWT (cookie).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid email or password
        "403":
          description: Account exists but email is not verified

  /auth/resend-otp:
    post:
      operationId: resendOtp
      tags: [Auth]
      summary: Resends the email verification code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Verification code resent
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Starts the password recovery flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Password recovery request accepted
        "400":
          description: Invalid request

  /auth/me:
    get:
      operationId: getMyProfile
      tags: [Auth]
      summary: Returns the logged-in user's profile.
      responses:
        "200":
          description: The current user's profile
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMyProfile
      tags: [Auth]
      summary: Updates the logged-in user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: Profile updated
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deactivateMyAccount
      tags: [Auth]
      summary: Deactivates the logged-in user's account and clears session cookies.
      responses:
        "200":
          description: Account deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/password:
    patch:
      operationId: changeMyPassword
      tags: [Auth]
      summary: Changes the logged-in user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                confirm_password:
                  type: string
      responses:
        "200":
          description: Password changed
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Clears the session cookie.
      responses:
        "200":
          description: Logged out
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/universities:
    get:
      operationId: getUniversities
      tags: [Auth]
      summary: Lists supported universities, for the registration dropdown.
      security: []
      responses:
        "200":
          description: List of universities
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Gets a new access token using a refresh token.
      security: []
      responses:
        "200":
          description: New access token issued
        "400":
          $ref: "#/components/responses/BadRequest"

  /listings:
    post:
      operationId: createListing
      tags: [Listings]
      summary: Creates a new textbook listing. Created with status = PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: CreateListingDto fields for the listing to submit.
      responses:
        "201":
          description: Listing created
        "400":
          description: Validation error
    get:
      operationId: listApprovedListings
      tags: [Listings]
      summary: Returns all APPROVED listings, with pagination and filters.
      parameters:
        - in: query
          name: university
          schema: { type: string }
        - in: query
          name: moduleCode
          schema: { type: string }
        - in: query
          name: faculty
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string }
        - in: query
          name: annotationLevel
          schema: { type: string }
        - in: query
          name: priceMin
          schema: { type: number }
        - in: query
          name: priceMax
          schema: { type: number }
        - in: query
          name: edition
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Paginated approved listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Listing"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /listings/mine:
    get:
      operationId: getMyListings
      tags: [Listings]
      summary: Returns all of the logged-in student's own listings (PENDING, APPROVED, REJECTED).
      responses:
        "200":
          description: The student's own listings
        "400":
          $ref: "#/components/responses/BadRequest"

  /listings/{id}:
    get:
      operationId: getListingById
      tags: [Listings]
      summary: Returns the full detail object for one listing.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/editlist:
    patch:
      operationId: editListing
      tags: [Listings]
      summary: Edits an existing listing owned by the student. Only PENDING/REJECTED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                condition: { type: string, enum: [new, good, fair, poor] }
                annotation_level: { type: string, enum: [none, light, heavy] }
                price: { type: number }
                has_notes: { type: boolean }
                description: { type: string }
      responses:
        "200":
          description: Listing updated
        "403":
          $ref: "#/components/responses/Forbidden"

  /listings/{id}/status:
    patch:
      operationId: updateListingStatus
      tags: [Listings]
      summary: >
        Updates a listing's status. Extended in Sprint 5 to accept RESERVED
        in addition to the existing SOLD/WITHDRAWN values. Callable by the
        listing's seller from the messaging thread (ChatHeader) once a sale
        is agreed, or from My Listings.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_status]
              properties:
                listing_status:
                  type: string
                  enum: [AVAILABLE, RESERVED, SOLD, WITHDRAWN]
      responses:
        "200":
          description: Status updated, audit_log entry written
        "403":
          description: Not the listing's seller, or an invalid status transition
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/admin/all:
    get:
      operationId: getAllListingsForAdmin
      tags: [Admin]
      summary: Returns all listings, admin only.
      responses:
        "200":
          description: All listings
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/{id}/approve:
    patch:
      operationId: approveListing
      tags: [Admin]
      summary: Approves a pending listing. Sets status APPROVED, writes audit log.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listing approved
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/{id}/reject:
    patch:
      operationId: rejectListing
      tags: [Admin]
      summary: Rejects a pending listing. Sets status REJECTED, writes audit log.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Listing rejected
        "403":
          $ref: "#/components/responses/Forbidden"

  /modules:
    post:
      operationId: createModule
      tags: [Modules]
      summary: Creates a module linked to the textbook being sold.
      responses:
        "201":
          description: Module created
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: searchModules
      tags: [Modules]
      summary: Search-as-you-type module code lookup, extended with smart filters.
      parameters:
        - in: query
          name: search
          required: true
          schema: { type: string }
        - in: query
          name: university
          schema: { type: string }
      responses:
        "200":
          description: Matching modules
        "400":
          $ref: "#/components/responses/BadRequest"

  /modules/faculties:
    get:
      operationId: listFaculties
      tags: [Modules]
      summary: Returns faculty names and ids.
      responses:
        "200":
          description: Faculties
        "400":
          $ref: "#/components/responses/BadRequest"

  /saved-searches:
    post:
      operationId: createSavedSearch
      tags: [SavedSearches]
      summary: Saves a search as JSON filter_json.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter_json:
                  type: object
      responses:
        "201":
          description: Saved search created
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getAllSavedSearches
      tags: [SavedSearches]
      summary: Returns all saved searches (admin only).
      responses:
        "200":
          description: All saved searches
        "403":
          $ref: "#/components/responses/Forbidden"

  /saved-searches/mine:
    get:
      operationId: getMySavedSearches
      tags: [SavedSearches]
      summary: Returns the saved searches belonging to the logged-in student.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The student's saved searches
        "401":
          $ref: "#/components/responses/Unauthorized"

  /saved-searches/{id}:
    get:
      operationId: getSavedSearchById
      tags: [SavedSearches]
      summary: Returns one saved search by id.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The saved search
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSavedSearch
      tags: [SavedSearches]
      summary: Deletes a saved search by id.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
